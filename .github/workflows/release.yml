name: Build and Release Launcher

# Publishes a friend-friendly portable ZIP plus per-file updater assets.
# Friends should download AAEmu-Launcher-vX.X.X.X.zip, extract it, and run
# "Start Launcher.bat".

on:
  push:
    tags:
      - "v*.*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v", "V")
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Stamp assembly version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $files = @(
            "AAEmu.Launcher/Properties/AssemblyInfo.cs",
            "AAEmu.Common.Launcher/Properties/AssemblyInfo.cs"
          )
          foreach ($file in $files) {
            (Get-Content $file) `
              -replace 'AssemblyVersion\("[^"]*"\)', "AssemblyVersion(`"$version`")" `
              -replace 'AssemblyFileVersion\("[^"]*"\)', "AssemblyFileVersion(`"$version`")" |
              Set-Content $file
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore AAEmu-Launcher.sln

      - name: Build (Release)
        run: msbuild AAEmu-Launcher.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Verify launcher installation and presentation
        shell: pwsh
        run: |
          ./scripts/Test-HawkNative.ps1
          ./scripts/Test-LauncherPresentation.ps1

      - name: Generate portable ZIP
        shell: pwsh
        run: |
          $outDir = "AAEmu.Launcher/bin/Release"
          $stagingDir = "release-assets"
          $packageRoot = "portable-package"
          $packageDir = Join-Path $packageRoot "AAEmu-Launcher"
          $zipName = "AAEmu-Launcher-v${{ steps.version.outputs.version }}.zip"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

          ./scripts/Install-JasonGamesLauncher.ps1 -BuildDirectory $outDir -Destination $packageDir -NoShortcut
          Copy-Item docs/jason-hawk-skater.md (Join-Path $packageDir "JasonHawkSkater.md")

          @'
          @echo off
          cd /d "%~dp0"
          start "" "AAEmu.Launcher.exe"
          '@ | Set-Content -Path (Join-Path $packageDir "Start Launcher.bat") -Encoding ASCII

          @"
          AAEmu Launcher v${{ steps.version.outputs.version }}

          How to start:
          1. Extract this ZIP somewhere writable, such as your Desktop or Documents folder.
          2. Double-click "Start Launcher.bat".
          3. Pick a game tab, then click Install or Play. Settings lets you choose the installation folder.

          Notes:
          - Do not run the launcher directly from inside the ZIP. Extract it first.
          - Keep all files in this folder together.
          - The launcher includes the helper files it needs for client extraction.
          - JasonHawkSkater runs natively on Windows x64 and installs its runtime/assets automatically.
          - Start its server externally through the Discord helper; the launcher cannot wake it.
          - Keyboard: W/S push/brake, A/D steer, hold/release Space ollie, arrows tricks, J board, K camera, R recover.
          - If Windows SmartScreen appears, choose More info, then Run anyway if you trust this release.
          "@ | Set-Content -Path (Join-Path $packageDir "README-FIRST.txt") -Encoding UTF8

          $manifestFiles = @()
          Get-ChildItem -Path $packageDir -File -Recurse | ForEach-Object {
            $relativePath = [System.IO.Path]::GetRelativePath($packageDir, $_.FullName).Replace("\", "/")
            $assetName = $relativePath.Replace("/", "_")
            $assetPath = Join-Path $stagingDir $assetName

            Copy-Item -LiteralPath $_.FullName -Destination $assetPath -Force
            $manifestFiles += [PSCustomObject]@{
              path   = $relativePath
              sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              size   = $_.Length
            }
          }

          [PSCustomObject]@{
            version = "${{ steps.version.outputs.version }}"
            files   = $manifestFiles
          } | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $stagingDir "manifest.json") -Encoding UTF8

          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath (Join-Path $stagingDir $zipName) -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Launcher v${{ steps.version.outputs.version }}"
          body: |
            ## Download

            Download **AAEmu-Launcher-v${{ steps.version.outputs.version }}.zip**, extract it, then run **Start Launcher.bat**.

            Existing launcher installs can update in-app from this release.
          files: release-assets/*
          generate_release_notes: true
