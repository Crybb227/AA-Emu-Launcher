# Publisher-only config: replace the UUID and private credential path after
# Cloudflare authorization. Run cloudflared inside the hosting dml-arch distro.
# Never include this credential file, account cert.pem or tunnel token in a release.
tunnel: 00000000-0000-0000-0000-000000000000
credentials-file: /home/dml/.cloudflared/00000000-0000-0000-0000-000000000000.json
loglevel: warn
ingress:
  - hostname: games-api.jmservers.com
    path: ^/v1/(attach|heartbeat|release)$
    service: http://127.0.0.1:18765
  - hostname: games-api.jmservers.com
    path: ^/v1/auth/(device|token|authorize|callback)$
    service: http://127.0.0.1:18766
  - hostname: games-api.jmservers.com
    path: ^/v1/manifest$
    service: http://127.0.0.1:18766
  - hostname: games-api.jmservers.com
    path: ^/v1/files/([a-f0-9]{64}|[0-9]+)$
    service: http://127.0.0.1:18766
  - hostname: games-api.jmservers.com
    path: ^/v1/skate/(manifest|files/[a-f0-9]{64})$
    service: http://127.0.0.1:18766
  # All other hosts and routes (including wake/admin) remain unavailable.
  - service: http_status:404
