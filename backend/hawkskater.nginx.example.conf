# Provision DNS and a valid certificate before enabling this host. Do not copy
# certificate paths until they exist. No credentials belong in this file.
server {
    listen 443 ssl;
    server_name games-api.jmservers.com;
    ssl_certificate /etc/letsencrypt/live/games-api.jmservers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games-api.jmservers.com/privkey.pem;
    client_max_body_size 4k;
    add_header Cache-Control "no-store" always;
    # Per-IP limits should also be configured in the enclosing http block.
    # OAuth query parameters contain temporary codes: never log them.
    access_log off;
    location ~ ^/v1/(attach|heartbeat|release)$ {
        proxy_pass http://127.0.0.1:18765;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }
    location /v1/auth/ {
        proxy_pass http://127.0.0.1:18766;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }
    location = /v1/manifest {
        proxy_pass http://127.0.0.1:18766;
        proxy_set_header Authorization $http_authorization;
    }
    location /v1/files/ {
        proxy_pass http://127.0.0.1:18766;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
    location ~ ^/v1/skate/(manifest|files/[a-f0-9]{64})$ {
        proxy_pass http://127.0.0.1:18766;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
    # Wake/admin routes are deliberately not exposed by the player gateway.
    # The Discord helper calls the controller directly with its own identity.
    location / { return 404; }
}
